info:
  name: Update Student
  type: http
  seq: 4
  tags:
    - Students

http:
  method: PUT
  url: "{{baseUrl}}/students/:student_id"
  params:
    - name: student_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "first_name": "",
        "last_name": "",
        "email": "",
        "age": "",
        "gender": "",
        "course_id": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/students/:student_id"
      method: PUT
      params:
        - name: student_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "first_name": "",
            "last_name": "",
            "email": "",
            "age": "",
            "gender": "",
            "course_id": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "first_name": "",
            "last_name": "",
            "email": "",
            "age": "",
            "gender": "",
            "course_id": "",
            "student_id": 0,
            "enrollment_date": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/students/:student_id"
      method: PUT
      params:
        - name: student_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "first_name": "",
            "last_name": "",
            "email": "",
            "age": "",
            "gender": "",
            "course_id": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }
