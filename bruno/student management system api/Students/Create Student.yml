info:
  name: Create Student
  type: http
  seq: 2
  tags:
    - Students

http:
  method: POST
  url: http://localhost:8000/students/
  body:
    type: json
    data: |-
      {
        "first_name": "Test",
        "last_name": "Student",
        "email": "bruno.test.20261118@example.com",
        "age": 20,
        "gender": "Male",
        "course_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/students/"
      method: POST
      body:
        type: json
        data: |-
          {
            "first_name": "",
            "last_name": "",
            "email": "",
            "age": "",
            "gender": "",
            "course_id": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "first_name": "",
            "last_name": "",
            "email": "",
            "age": "",
            "gender": "",
            "course_id": "",
            "student_id": 0,
            "enrollment_date": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/students/"
      method: POST
      body:
        type: json
        data: |-
          {
            "first_name": "",
            "last_name": "",
            "email": "",
            "age": "",
            "gender": "",
            "course_id": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }
